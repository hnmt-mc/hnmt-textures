name: release

# タグ（v1.2.3 の形）を push すると、検査して、配布用の zip と pack.json を、リリースに付ける。
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 道具の依存を入れる
        run: python -m pip install -r tools/requirements.txt
      - name: 検査（パックの構造・料理のモデル・pack.json の作り）
        run: |
          python tools/verify_pack.py
          python -m unittest discover -s tools -p 'test_food_models.py'
          python -m unittest discover -s tools -p 'test_rice_models.py'
          python -m unittest discover -s tools -p 'test_rice_interaction.py'
          python -m unittest discover -s tools -p 'test_menu_icons.py'
          python -m unittest discover -s tools -p 'test_make_manifest.py'
          python -m unittest discover -s tools -p 'test_blender_coolers.py'
          python -m unittest discover -s tools -p 'test_make_bedrock*.py'
      - name: zip を作る
        run: |
          sh tools/build_zip.sh
          sh tools/build_zip.sh flat
          python tools/verify_pack.py
      - name: pack.json を作る
        run: python tools/make_manifest.py "$GITHUB_REF_NAME"
      - name: 統合版のパックと bedrock.json を作る
        run: |
          python tools/make_bedrock.py . build/bedrock "$GITHUB_REF_NAME"
          python tools/make_bedrock_manifest.py "$GITHUB_REF_NAME" build/bedrock
      - name: リリースに付ける
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/hnmt-textures.zip build/hnmt-textures-flat.zip build/pack.json \
            build/bedrock/hnmt-bedrock.mcpack build/bedrock/custom_mappings/hnmt.json build/bedrock/custom_mappings/hnmt_blocks.json build/bedrock/bedrock.json \
            --title "$GITHUB_REF_NAME" --notes "3D版（hnmt-textures.zip）が、Java版のサーバーから送られるパックです。pack.json は、その更新の情報です。hnmt-bedrock.mcpack・hnmt.json・hnmt_blocks.json は、統合版（Geyser）用のパックと対応づけ（アイテムとブロック）で、bedrock.json は、その更新の情報です。"
